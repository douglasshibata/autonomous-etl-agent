[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-etl-agent"
version = "2.0.0"
description = "Enterprise Autonomous Data Wrangling and ETL Agent Platform powered by LangGraph, Arrow, and AST Sandboxing"
authors = [{ name = "Enterprise Data Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.2",
    "langgraph>=0.0.20",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
etl-agent = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
